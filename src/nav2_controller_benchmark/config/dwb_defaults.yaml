# Parameters merged into controller_server.ros__parameters.FollowPath by
# prepare_benchmark_params.py when --controller dwb is selected.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      visualize: true           # ⬇️ 开启可视化
      publish_traj: true        # ⬇️ 发布轨迹
      desired_linear_vel: 0.1           # 期望线速度
      lookahead_dist: 0.5              # 前视距离
      min_lookahead_dist: 0.2          # 最小前视距离
      max_lookahead_dist: 1.0          # 最大前视距离
      lookahead_time: 1.5             # 前视时间（动态调整前视距离）
      rotate_to_heading_angular_vel: 0.5  # 转向角速度
      transform_tolerance: 0.5          # TF 容忍时间
      use_velocity_scaled_lookahead_dist: true  # 根据速度动态调整前视距离
      use_regulated_linear_velocity_scaling: true  # 根据曲率调节速度
      use_cost_regulated_linear_velocity_scaling: false  # 根据代价地图调节速度
      regulated_linear_scaling_min_radius: 0.3   # 最小转弯半径
      regulated_linear_scaling_min_speed: 0.03  # 最小调节速度
      use_rotate_to_heading: false      # 允许原地转向
      allow_reversing: false            # 不允许倒车（轮足机器人通常不倒退）
      max_robot_pose_search_dist: 3.0 # 最大搜索路径距离
      use_interpolation: true          # 路径插值
      cost_scaling_dist: 0.3            # 代价调节距离
      cost_scaling_gain: 1.0           # 代价调节增益