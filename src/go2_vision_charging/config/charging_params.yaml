# 几何参数
geometry:
  offset_x: 0.0
  offset_y: -0.616
  offset_z: -1.00
  target_dock_dist: 0.0

# PID 控制参数
pid:
  k_p_x: 0.5
  k_p_y: 0.8
  k_p_z: 1.0
  k_i_x: 0.05
  k_i_y: 0.05
  k_i_z: 0.05
  k_d_x: 0.1
  k_d_y: 0.1
  k_d_z: 0.1
  yaw_priority_lateral: 0.06
  yaw_priority_yaw: 0.05
  final_lateral_slow_abs_err_x: 0.10
  final_lateral_slow_band: 0.08
  final_lateral_slow_scale: 0.4

# 速度限制
limits:
  max_v_x: 0.15
  max_v_y: 0.10
  max_w_z: 0.3

# 收敛容差
tolerance:
  dist: 0.05
  lateral: 0.03
  yaw: 0.05
  dist_relaxed: 0.08
  lateral_relaxed: 0.05
  yaw_relaxed: 0.07

stable:
  threshold: 15

# 超时配置
timeout:
  search: 10.0
  align: 30.0

# 速度低通滤波
filter:
  alpha: 0.3

# gait 侧向补偿
gait:
  enable: true
  trigger_lateral: 0.12
  trigger_near_dist: 0.18
  trigger_yaw: 0.12
  trigger_min_abs_err_x: 0.12
  max_abs_yaw: 0.30
  disable_after_stable_count: 3
  cooldown: 2.0

# 对接完成后的动作
post_dock:
  enabled: true
  forward_distance: 1.0
  forward_speed: 0.20
  # 可配置为底层趴下动作工具，例如:
  # lie_down_command: "/home/wheeltec/ws_nav/src/go2_real/go2_vision_charging/scripts/dog_lying_down"
  lie_down_command: ""
  undock_back_distance: 1.0
  undock_back_speed: 0.20
  undock_prepare_delay: 3.0
