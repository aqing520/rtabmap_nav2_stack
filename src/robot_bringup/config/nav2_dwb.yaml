# Suggested location:
#   robot_bringup/config/nav2_common.yaml
#
# Design intent:
# - RTAB-Map publishes /map and map -> odom.
# - FAST-LIO publishes odom -> base_footprint and /Odometry.
# - navigation_launch.py from nav2_bringup is used (NOT amcl/localization_launch.py).
# - global_costmap works in map frame; local_costmap works in odom frame.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /Odometry
    default_nav_to_pose_bt_xml: /home/wheeltec/xz/rtabmap_nav2_stack/src/robot_bringup/config/navigate_to_pose_clear_costmaps_on_goal_start.xml
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ['progress_checker']
    goal_checker_plugins: ['general_goal_checker']
    controller_plugins: ['FollowPath']
    speed_limit_topic: speed_limit

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 40.0

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 1.57

    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.60
      max_vel_y: 0.0
      max_vel_theta: 1.00
      min_speed_xy: 0.0
      max_speed_xy: 0.60
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 1.6
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.8
      vx_samples: 24
      vy_samples: 1
      vtheta_samples: 32
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 2.0
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: false
      stateful: true
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      BaseObstacle:
        scale: 1.20
      PathAlign:
        scale: 10.0
        forward_point_distance: 0.20
      GoalAlign:
        scale: 8.0
        forward_point_distance: 0.20
      PathDist:
        scale: 14.0
      GoalDist:
        scale: 14.0
      RotateToGoal:
        scale: 24.0
        slowing_factor: 4.0
        lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.26
      transform_tolerance: 2.0
      tf_buffer_duration: 5.0
      plugins: ['stvl_layer', 'inflation_layer']
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 4.0
        decay_model: 0
        voxel_size: 0.07
        track_unknown_space: false
        observation_persistence: 0.0
        publish_voxel_map: false
        origin_z: -0.5
        max_obstacle_height: 1.00
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 3.5
        transform_tolerance: 2.0
        mapping_mode: false
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          topic: /cloud_registered_body
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 1.00
          expected_update_rate: 0.0
          observation_persistence: 0.0
          clear_after_reading: true
          filter: voxel
          voxel_min_points: 2
        lidar_clear:
          enabled: true
          topic: /cloud_registered_body
          data_type: PointCloud2
          marking: false
          clearing: true
          min_z: -0.20
          max_z: 1.20
          vertical_fov_angle: 1.05
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 1.0
          model_type: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.60
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 2.0
      tf_buffer_duration: 5.0
      robot_radius: 0.26
      resolution: 0.05
      track_unknown_space: true
      plugins: ['static_layer', 'stvl_layer', 'inflation_layer']
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
        unknown_cost_value: 255
        lethal_cost_threshold: 50
        trinary_costmap: true
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 8.0
        decay_model: 0
        voxel_size: 0.10
        track_unknown_space: true
        observation_persistence: 0.0
        publish_voxel_map: false
        origin_z: -0.5
        max_obstacle_height: 1.00
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        obstacle_range: 6.0
        transform_tolerance: 2.0
        mapping_mode: false
        observation_sources: lidar_mark lidar_clear
        lidar_mark:
          topic: /cloud_registered_body
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.05
          max_obstacle_height: 1.00
          expected_update_rate: 0.0
          observation_persistence: 0.0
          clear_after_reading: true
          filter: voxel
          voxel_min_points: 2
        lidar_clear:
          enabled: true
          topic: /cloud_registered_body
          data_type: PointCloud2
          marking: false
          clearing: true
          min_z: -0.20
          max_z: 1.20
          vertical_fov_angle: 1.05
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
          decay_acceleration: 1.0
          model_type: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.60
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ['GridBased']
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.50
      use_astar: false
      allow_unknown: true


smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 2.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'assisted_teleop', 'wait']
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.60, 0.0, 1.00]
    min_velocity: [-0.05, 0.0, -1.00]
    max_accel: [1.00, 0.0, 2.00]
    max_decel: [-1.50, 0.0, -2.00]
    odom_topic: /Odometry
    odom_duration: 0.10
    deadband_velocity: [0.05, 0.0, 0.02]
    velocity_timeout: 1.0
